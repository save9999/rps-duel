<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>NEON DUEL — Pierre · Feuille · Ciseaux</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --p1:#22d3ee; --p2:#e879f9; --accent:var(--p1); }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

  html, body {
    height: 100%; margin: 0; overflow: hidden;
    overscroll-behavior: none; touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #09090b; color: #fafafa;
  }

  #app { position: relative; }
  #app::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    transition: background .5s ease;
    background:
      radial-gradient(70% 50% at 50% 0%,   color-mix(in srgb, var(--accent) 26%, transparent), transparent 72%),
      radial-gradient(70% 50% at 50% 100%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 72%),
      radial-gradient(95% 65% at 50% 50%, #18181b 0%, #09090b 78%);
  }
  #app > * { position: relative; z-index: 1; }

  /* ---- Boutons de coup ---- */
  .move-btn {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem;
    flex: 1 1 0; min-width: 0; border-radius: 1.6rem; padding: clamp(1rem, 4vh, 2.4rem) .5rem;
    background: linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
    border: 1px solid rgba(255,255,255,.10); box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
    color: #e4e4e7; transition: transform .12s, box-shadow .2s, border-color .2s, background .2s; cursor: pointer;
  }
  .move-btn .emoji { font-size: clamp(2.6rem, 12vh, 6rem); line-height: 1; filter: drop-shadow(0 6px 14px rgba(0,0,0,.55)); }
  .move-btn .label { font-size: clamp(.72rem, 2.2vh, 1.15rem); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .82; }
  .move-btn:hover, .move-btn:focus-visible {
    border-color: color-mix(in srgb, var(--mv) 65%, transparent);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--mv) 45%, transparent), 0 0 30px color-mix(in srgb, var(--mv) 45%, transparent), inset 0 0 24px color-mix(in srgb, var(--mv) 14%, transparent);
    background: linear-gradient(160deg, color-mix(in srgb, var(--mv) 16%, transparent), rgba(255,255,255,.02));
  }
  .move-btn:active { transform: scale(.94); box-shadow: 0 0 0 2px var(--mv), 0 0 44px color-mix(in srgb, var(--mv) 70%, transparent); }

  .cta {
    border-radius: 999px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    padding: clamp(.8rem, 2.2vh, 1.1rem) clamp(1.6rem, 6vw, 2.6rem); cursor: pointer;
    color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    box-shadow: 0 0 28px color-mix(in srgb, var(--accent) 30%, transparent);
    transition: transform .12s, box-shadow .2s, background .2s;
  }
  .cta:active { transform: scale(.94); }

  .title { font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--accent);
    text-shadow: 0 0 28px color-mix(in srgb, var(--accent) 55%, transparent); }

  .panel { animation: slideIn .35s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

  .lock { font-size: clamp(3rem, 16vh, 8rem); line-height: 1; animation: lockPulse 1.8s ease-in-out infinite; }
  @keyframes lockPulse { 0%,100% { transform: scale(1); filter: drop-shadow(0 0 0 transparent); } 50% { transform: scale(1.06); filter: drop-shadow(0 0 26px color-mix(in srgb, var(--accent) 60%, transparent)); } }
  .swap { font-size: clamp(3.4rem, 18vh, 9rem); line-height: 1; animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fist { font-size: clamp(3rem, 16vh, 8rem); line-height: 1; animation: shake .3s ease-in-out infinite; }
  @keyframes shake { 0%,100% { transform: rotate(0) translateY(0); } 25% { transform: rotate(-10deg) translateY(-9%); } 75% { transform: rotate(10deg) translateY(-9%); } }
  .beat { font-weight: 900; letter-spacing: .18em; text-transform: uppercase; font-size: clamp(2rem, 8vh, 4rem);
    background: linear-gradient(90deg, var(--p1), var(--p2)); -webkit-background-clip: text; background-clip: text; color: transparent; animation: popIn .22s ease; }
  @keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .reveal-emoji { font-size: clamp(3.4rem, 20vh, 9rem); line-height: 1; animation: popBounce .5s cubic-bezier(.2,1.4,.4,1); filter: drop-shadow(0 8px 20px rgba(0,0,0,.6)); }
  @keyframes popBounce { 0% { transform: scale(0) rotate(-22deg); opacity: 0; } 60% { transform: scale(1.16) rotate(6deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  .verdict { font-weight: 900; letter-spacing: .12em; text-transform: uppercase; font-size: clamp(1.8rem, 7vh, 3.6rem); animation: popIn .3s ease; }
  .verdict.win  { color: #4ade80; text-shadow: 0 0 30px rgba(74,222,128,.7); animation: winPulse 1.1s ease-in-out infinite; }
  .verdict.draw { color: #fbbf24; text-shadow: 0 0 26px rgba(251,191,36,.6); }
  @keyframes winPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  .chip { display: inline-flex; align-items: center; gap: .4rem; font-weight: 800; letter-spacing: .06em; }
  .reset-btn { transition: transform .12s, background .2s, border-color .2s; }
  .reset-btn:active { transform: scale(.9); }

  /* ===== Cinématiques vidéo des dénouements ===== */
  .battle { width: 100%; max-width: 420px; margin: 0 auto; }
  .battle-vid { width: 100%; height: auto; display: block; border-radius: 1.2rem;
    box-shadow: 0 18px 40px rgba(0,0,0,.6); background: #000; }
  .cap { font-weight: 800; letter-spacing: .04em; font-size: clamp(.9rem,2.6vh,1.2rem);
    opacity: 0; animation: capIn .4s ease 1.2s both; }
  @keyframes capIn { from { opacity: 0; transform: translateY(6px); } to { opacity: .9; transform: none; } }

  /* ===== Écrans en ligne ===== */
  .screen { width: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; padding: 1rem; }
  .menu-btn { display:flex; align-items:center; justify-content:center; gap:.6rem; width:100%;
    padding: 1.1rem 1.2rem; border-radius: 1.1rem; font-weight: 800; letter-spacing:.04em; font-size: 1.05rem;
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.12); color:#fafafa; cursor:pointer;
    transition: transform .12s, border-color .2s, box-shadow .2s; }
  .menu-btn:active { transform: scale(.97); }
  .menu-btn.primary { border-color: color-mix(in srgb, var(--p1) 60%, transparent);
    box-shadow: 0 0 30px color-mix(in srgb, var(--p1) 25%, transparent);
    background: color-mix(in srgb, var(--p1) 14%, transparent); color: var(--p1); }
  .menu-btn.p2 { border-color: color-mix(in srgb, var(--p2) 60%, transparent);
    box-shadow: 0 0 30px color-mix(in srgb, var(--p2) 25%, transparent);
    background: color-mix(in srgb, var(--p2) 14%, transparent); color: var(--p2); }
  .fld { width:100%; padding:.9rem 1rem; border-radius:.9rem; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.14); color:#fafafa; font-size:1rem; text-align:center; }
  .fld:focus { outline:none; border-color: var(--p1); }
  .lb-row { display:flex; align-items:center; gap:.6rem; padding:.55rem .8rem; border-radius:.7rem;
    background: rgba(255,255,255,.04); font-weight:700; }
  .lb-rank { width:1.7rem; text-align:center; opacity:.7; font-weight:900; }
  .lb-elo { margin-left:auto; color:var(--p1); font-weight:900; }
  .omove { flex:1; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:clamp(2.4rem,10vh,4rem);
    border-radius:1.3rem; background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.12); cursor:pointer; transition:transform .1s,border-color .2s,box-shadow .2s; }
  .omove:active { transform:scale(.93); }
  .omove:disabled { opacity:.4; cursor:default; }
  .omove.sel { border-color:var(--p1); box-shadow:0 0 0 2px var(--p1),0 0 26px color-mix(in srgb,var(--p1) 60%,transparent); }
  .chat { display:flex; flex-direction:column; gap:.4rem; height:26vh; }
  .chat-log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:.3rem; padding:.5rem;
    background:rgba(255,255,255,.03); border-radius:.8rem; font-size:.9rem; }
  .chat-msg { padding:.25rem .5rem; border-radius:.5rem; background:rgba(255,255,255,.05); align-self:flex-start; max-width:85%; }
  .chat-msg.me { align-self:flex-end; background:color-mix(in srgb,var(--p1) 22%,transparent); }
  .waiting { display:inline-block; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
</style>
</head>

<body>
  <div id="app" class="fixed inset-0 flex flex-col" style="height:100dvh">

    <!-- ===== En-tête : score + reset ===== -->
    <header id="topbar" class="shrink-0 flex items-center justify-center gap-3 px-4 pt-4 pb-2">
      <div class="score-board"></div>
      <button id="sound" class="reset-btn w-10 h-10 rounded-full grid place-items-center text-base
               bg-white/5 border border-white/15 hover:bg-white/10 active:bg-white/15"
               title="Couper / activer le son" aria-label="Son">🔊</button>
      <button id="reset" class="reset-btn w-10 h-10 rounded-full grid place-items-center text-base
               bg-white/5 border border-white/15 hover:bg-white/10 active:bg-white/15"
               title="Rejouer la manche (maintenir = scores à 0)" aria-label="Recommencer">↻</button>
    </header>

    <!-- ===== Scène principale ===== -->
    <main id="scene" class="flex-1 min-h-0 flex flex-col items-center justify-center px-4 pb-5 text-center"></main>

  </div>

  const topbar = document.getElementById("topbar");
  const showTop = (v) => topbar.style.display = v ? "" : "none";
  const esc = (s) => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function cleanupOnline() {
    if (oChan) { SB.removeChannel(oChan); oChan = null; }
    if (mmChan) { SB.removeChannel(mmChan); mmChan = null; }
    if (pollT) { clearInterval(pollT); pollT = null; }
    oMatch = null; myMove = null;
  }

  // ---------- Accueil ----------
  function showHome() {
    clearTimers(); cleanupOnline(); showTop(false); setAccent(0);
    phase = "home";
    scene.innerHTML = `
      <div class="screen panel items-center text-center">
        <div class="title" style="font-size:clamp(1.8rem,7vh,3rem)">NEON DUEL</div>
        <div class="opacity-60 -mt-2 mb-2" style="letter-spacing:.14em;font-weight:700">PIERRE · FEUILLE · CISEAUX</div>
        <button class="menu-btn primary" data-oact="local">🎮 Jouer à 2 (même écran)</button>
        <button class="menu-btn p2" data-oact="online">🌐 Jouer en ligne</button>
      </div>`;
  }

  function startLocal() {
    cleanupOnline(); showTop(true); scores[1]=0; scores[2]=0;
    choice[1]=choice[2]=null; winner=null; beat=""; phase="p1"; render();
  }

  // ---------- Init Supabase / auth / profil ----------
  async function ensureAuth() {
    if (!SB) SB = window.supabase.createClient(SB_URL, SB_KEY);
    let { data:{ session } } = await SB.auth.getSession();
    if (!session) { const r = await SB.auth.signInAnonymously(); if (r.error) throw r.error; session = r.data.session; }
    uid = session.user.id;
    try { SB.realtime.setAuth(session.access_token); } catch(_) {}
    const { data } = await SB.from("rps_profiles").select("pseudo,elo,wins,losses").eq("id", uid).maybeSingle();
    if (data) { myPseudo = data.pseudo; myElo = data.elo; myW = data.wins; myL = data.losses; }
  }

  async function enterOnline() {
    setScreenMsg("Connexion…");
    try { await ensureAuth(); }
    catch (e) { return setScreenMsg("Connexion impossible 😕", true); }
    if (myPseudo) showLobby(); else askPseudo();
  }

  function setScreenMsg(msg, retry) {
    showTop(false); phase = "online";
    scene.innerHTML = `<div class="screen items-center text-center panel">
      <div class="waiting" style="font-size:1.1rem;font-weight:800">${esc(msg)}</div>
      ${retry ? '<button class="menu-btn" data-oact="online">Réessayer</button>' : ''}
      <button class="menu-btn" data-oact="home">← Menu</button></div>`;
  }

  function askPseudo() {
    showTop(false); phase = "online";
    scene.innerHTML = `<div class="screen items-center text-center panel">
      <div class="title" style="font-size:1.6rem">Ton pseudo</div>
      <input id="opseudo" class="fld" maxlength="16" placeholder="Ex: NeoBjj" value="${esc(myPseudo||'')}">
      <button class="menu-btn primary" data-oact="savePseudo">Valider</button>
      <button class="menu-btn" data-oact="home">← Menu</button></div>`;
    const inp = document.getElementById("opseudo"); inp.focus();
    inp.addEventListener("keydown", e => { if (e.key === "Enter") savePseudo(); });
  }

  async function savePseudo() {
    const v = (document.getElementById("opseudo").value || "").trim();
    if (v.length < 2) { document.getElementById("opseudo").focus(); return; }
    myPseudo = v.slice(0,16);
    await SB.from("rps_profiles").upsert({ id: uid, pseudo: myPseudo });
    showLobby();
  }

  // ---------- Lobby ----------
  function showLobby() {
    clearTimers(); cleanupOnline(); showTop(false); setAccent(0); phase = "online";
    scene.innerHTML = `
      <div class="screen panel">
        <div class="flex items-center gap-2">
          <div><div style="font-weight:900;font-size:1.15rem">${esc(myPseudo)}</div>
            <div class="opacity-60" style="font-size:.85rem">ELO ${myElo} · ${myW}V ${myL}D</div></div>
          <button class="reset-btn ml-auto text-xs px-3 py-1.5 rounded-full bg-white/5 border border-white/15" data-oact="pseudo">Changer</button>
        </div>
        <button class="menu-btn primary" data-oact="quick">⚡ Partie rapide (classée)</button>
        <button class="menu-btn" data-oact="createPriv">🔒 Créer une partie privée</button>
        <button class="menu-btn" data-oact="joinPrivAsk">🔑 Rejoindre avec un code</button>
        <button class="menu-btn" data-oact="board">🏆 Classement</button>
        <button class="menu-btn" data-oact="home">← Menu</button>
      </div>`;
  }

  // ---------- Matchmaking rapide ----------
  async function quickMatch() {
    setScreenMsg("Recherche d'un adversaire…");
    scene.querySelector(".screen").insertAdjacentHTML("beforeend",
      `<button class="menu-btn" data-oact="cancelQuick">Annuler</button>`);
    const { data, error } = await SB.rpc("rps_find_quick_match");
    if (error) return setScreenMsg("Erreur matchmaking", true);
    if (data) return joinMatch(data);
    // en file : attendre qu'un adversaire crée le match (p1 = moi)
    mmChan = SB.channel("mm-"+uid)
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"rps_matches", filter:`p1=eq.${uid}` },
          p => { if (p.new.status === "playing") joinMatch(p.new.id); })
      .subscribe();
    pollT = setInterval(async () => {                       // filet de secours
      const { data:d } = await SB.from("rps_matches").select("id")
        .eq("p1", uid).eq("status","playing").order("created_at",{ascending:false}).limit(1);
      if (d && d[0]) joinMatch(d[0].id);
    }, 2500);
  }
  async function cancelQuick() { await SB.rpc("rps_leave_queue"); cleanupOnline(); showLobby(); }

  // ---------- Partie privée ----------
  async function createPrivate() {
    setScreenMsg("Création…");
    const { data, error } = await SB.rpc("rps_create_private");
    if (error || !data || !data[0]) return setScreenMsg("Erreur", true);
    const { match_id, code } = data[0];
    showTop(false);
    scene.innerHTML = `<div class="screen items-center text-center panel">
      <div class="opacity-70" style="font-weight:700">Partage ce code avec ton adversaire</div>
      <div class="title" style="font-size:3rem;letter-spacing:.3em">${code}</div>
      <div class="waiting" style="font-weight:800">En attente d'un joueur…</div>
      <button class="menu-btn" data-oact="cancelPriv" data-mid="${match_id}">Annuler</button></div>`;
    oChan = SB.channel("wait-"+match_id)
      .on("postgres_changes", { event:"UPDATE", schema:"public", table:"rps_matches", filter:`id=eq.${match_id}` },
          p => { if (p.new.status === "playing") joinMatch(match_id); })
      .subscribe();
    pollT = setInterval(async () => {                       // filet de secours
      const { data:d } = await SB.from("rps_matches").select("status").eq("id", match_id).maybeSingle();
      if (d && d.status === "playing") joinMatch(match_id);
    }, 2500);
  }

  function joinPrivAsk() {
    showTop(false); phase = "online";
    scene.innerHTML = `<div class="screen items-center text-center panel">
      <div class="title" style="font-size:1.6rem">Code de la partie</div>
      <input id="ocode" class="fld" maxlength="4" placeholder="ABCD" style="text-transform:uppercase;letter-spacing:.3em;font-size:1.4rem">
      <button class="menu-btn primary" data-oact="joinPriv">Rejoindre</button>
      <button class="menu-btn" data-oact="lobby">← Retour</button></div>`;
    document.getElementById("ocode").focus();
  }
  async function joinPrivate() {
    const c = (document.getElementById("ocode").value || "").trim().toUpperCase();
    if (c.length !== 4) return;
    const { data, error } = await SB.rpc("rps_join_private", { p_code: c });
    if (error) { alert("Partie introuvable"); return; }
    joinMatch(data);
  }

  // ---------- Classement ----------
  async function showBoard() {
    setScreenMsg("Chargement…");
    const { data } = await SB.rpc("rps_leaderboard");
    const rows = (data||[]).map((r,i)=>`<div class="lb-row"><span class="lb-rank">${i+1}</span>
      <span>${esc(r.pseudo)}</span><span class="lb-elo">${r.elo}</span></div>`).join("") || `<div class="opacity-60 text-center">Aucun joueur classé</div>`;
    showTop(false);
    scene.innerHTML = `<div class="screen panel"><div class="title" style="font-size:1.5rem;text-align:center">🏆 Classement</div>
      ${rows}<button class="menu-btn" data-oact="lobby">← Retour</button></div>`;
  }

  // ---------- Partie en ligne ----------
  async function joinMatch(id) {
    cleanupOnline();
    const { data: m } = await SB.from("rps_matches").select("*").eq("id", id).single();
    oMatch = m; iAmP1 = (m.p1 === uid); myMove = null;
    oChan = SB.channel("m-"+id)
      .on("postgres_changes", { event:"UPDATE", schema:"public", table:"rps_matches", filter:`id=eq.${id}` }, p => onMatch(p.new))
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"rps_rounds",  filter:`match_id=eq.${id}` }, p => onRound(p.new))
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"rps_messages", filter:`match_id=eq.${id}` }, p => onMsg(p.new))
      .subscribe();
    pollT = setInterval(syncMatch, 2500);                   // filet de secours realtime
    renderMatch();
  }

  // Re-synchronise l'état si un événement realtime a été manqué
  async function syncMatch() {
    if (!oMatch) return;
    const { data:m } = await SB.from("rps_matches").select("*").eq("id", oMatch.id).maybeSingle();
    if (!m) return;
    if (m.round > oMatch.round) {                            // manche(s) manquée(s)
      const { data:r } = await SB.from("rps_rounds").select("*")
        .eq("match_id", m.id).eq("round", m.round - 1).maybeSingle();
      oMatch = m; myMove = null;
      if (r) { renderMatch(r); setTimeout(() => { if (oMatch && oMatch.status!=="finished") renderMatch(); }, 1600); }
      else renderMatch();
    } else if (m.status !== oMatch.status) {
      oMatch = m;
      if (m.status === "finished") { await refreshProfile(); renderMatch(); }
    }
  }

  const myScore = () => iAmP1 ? oMatch.p1_score : oMatch.p2_score;
  const oppScore = () => iAmP1 ? oMatch.p2_score : oMatch.p1_score;
  const oppName = () => (iAmP1 ? oMatch.p2_pseudo : oMatch.p1_pseudo) || "Adversaire";

  function renderMatch(reveal) {
    showTop(false); phase = "online"; setAccent(iAmP1 ? 1 : 2);
    const done = oMatch.status === "finished";
    let center;
    if (done) {
      const iWon = oMatch.winner === uid;
      center = `<div class="verdict ${iWon?'win':''}" style="margin:1rem 0">${iWon?'🏆 Victoire !':'Défaite'}</div>
        <div class="opacity-70">Nouvel ELO : <b style="color:var(--p1)">${myElo}</b></div>
        <button class="menu-btn primary mt-3" data-oact="lobby">Retour au lobby</button>`;
    } else if (reveal) {
      const mine = iAmP1 ? reveal.p1_move : reveal.p2_move;
      const opp  = iAmP1 ? reveal.p2_move : reveal.p1_move;
      const rw = reveal.winner === 0 ? "Égalité" : ((reveal.winner===1)===iAmP1 ? "Manche gagnée !" : "Manche perdue");
      center = `<div class="flex items-center justify-center gap-6" style="margin:1rem 0">
          <span class="reveal-emoji">${EMO[mine]}</span><span class="opacity-40 font-black">VS</span>
          <span class="reveal-emoji">${EMO[opp]}</span></div>
        <div class="verdict ${reveal.winner===0?'draw':(((reveal.winner===1)===iAmP1)?'win':'')}" style="font-size:1.6rem">${rw}</div>`;
    } else {
      const waiting = myMove !== null;
      center = `<div style="margin:.5rem 0 1rem;font-weight:800" class="${waiting?'waiting':''}">
          ${waiting ? "En attente de l'adversaire…" : "À toi de jouer"}</div>
        <div class="flex gap-3 w-full">
          ${ORDER.map(k=>`<button class="omove ${myMove===k?'sel':''}" data-omove="${k}" ${waiting?'disabled':''}>${EMO[k]}</button>`).join("")}
        </div>`;
    }
    scene.innerHTML = `<div class="screen panel" style="gap:.6rem">
      <div class="flex items-center gap-2 w-full">
        <span class="chip" style="color:var(--p1)">🔵 ${esc(myPseudo)}</span>
        <span class="ml-auto mr-auto font-black" style="font-size:1.4rem">${myScore()} – ${oppScore()}</span>
        <span class="chip" style="color:var(--p2)">${esc(oppName())} 🟣</span>
      </div>
      <div class="opacity-50 text-center" style="font-size:.8rem">Manche ${oMatch.round} · premier à ${oMatch.target}${oMatch.ranked?' · classée':''}</div>
      <div class="text-center">${center}</div>
      ${done ? "" : `<div class="chat">
        <div class="chat-log" id="chatlog"></div>
        <div class="flex gap-2">
          <input id="chatin" class="fld" style="text-align:left" maxlength="200" placeholder="Message…">
          <button class="menu-btn" style="width:auto;padding:.6rem 1rem" data-oact="send">➤</button>
        </div></div>
        <button class="menu-btn" style="padding:.6rem" data-oact="quit">Quitter</button>`}
    </div>`;
    if (!done) { restoreChat(); const ci = document.getElementById("chatin");
      if (ci) ci.addEventListener("keydown", e => { if (e.key==="Enter") sendMsg(); }); }
  }

  async function sendMove(move) {
    if (myMove !== null || oMatch.status !== "playing") return;
    myMove = move; renderMatch();
    const { error } = await SB.rpc("rps_play_move", { p_match: oMatch.id, p_move: move });
    if (error) { myMove = null; renderMatch(); }
  }

  function onMatch(m) {
    const prevRound = oMatch ? oMatch.round : 1;
    oMatch = m;
    if (m.round > prevRound) myMove = null;      // nouvelle manche
    if (m.status === "finished") { refreshProfile().then(()=>renderMatch()); }
  }
  function onRound(r) {
    myMove = null;
    renderMatch(r);                               // affiche le reveal
    setTimeout(() => { if (oMatch && oMatch.status !== "finished") renderMatch(); }, 1600);
  }
  async function refreshProfile() {
    const { data } = await SB.from("rps_profiles").select("elo,wins,losses").eq("id", uid).maybeSingle();
    if (data) { myElo = data.elo; myW = data.wins; myL = data.losses; }
  }

  // ---------- Chat ----------
  const chatBuf = [];
  function onMsg(msg) { chatBuf.push(msg); appendChat(msg); }
  function appendChat(msg) {
    const log = document.getElementById("chatlog"); if (!log) return;
    const mine = msg.user_id === uid;
    const el = document.createElement("div");
    el.className = "chat-msg" + (mine ? " me" : "");
    el.innerHTML = `<b style="opacity:.7">${esc(msg.pseudo)}</b> ${esc(msg.text)}`;
    log.appendChild(el); log.scrollTop = log.scrollHeight;
  }
  function restoreChat() { chatBuf.forEach(appendChat); }
  async function sendMsg() {
    const inp = document.getElementById("chatin"); const t = (inp.value||"").trim();
    if (!t) return; inp.value = "";
    await SB.from("rps_messages").insert({ match_id: oMatch.id, user_id: uid, pseudo: myPseudo, text: t.slice(0,200) });
  }
  async function quitMatch() {
    if (oMatch && oMatch.status === "playing") await SB.rpc("rps_forfeit_match", { p_match: oMatch.id });
    chatBuf.length = 0; showLobby();
  }

  // ---------- Délégation des actions en ligne ----------
  scene.addEventListener("click", (e) => {
    const om = e.target.closest("[data-omove]"); if (om) return sendMove(om.dataset.omove);
    const a = e.target.closest("[data-oact]"); if (!a) return;
    const act = a.dataset.oact;
    ({ local:startLocal, online:enterOnline, home:showHome, lobby:showLobby,
       pseudo:askPseudo, savePseudo, quick:quickMatch, cancelQuick,
       createPriv:createPrivate, cancelPriv:()=>{cleanupOnline();showLobby();},
       joinPrivAsk, joinPriv:joinPrivate, board:showBoard, send:sendMsg, quit:quitMatch
     }[act] || (()=>{}))();
  });

  window.addEventListener("beforeunload", () => { if (oMatch && oMatch.status==="playing") navigator.sendBeacon && SB.rpc("rps_forfeit_match",{p_match:oMatch.id}); });

  showHome();
})();
</script>
</body>
</html>
